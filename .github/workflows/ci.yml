name: CI / Quality & Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    name: Python AI & Core Engine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python tests/test_detection.py
          python tests/test_acceptance.py

  web-build:
    name: Web Portal Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/Smart_Bijuka_Website

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: software/Smart_Bijuka_Website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Astro application
        run: npm run build
